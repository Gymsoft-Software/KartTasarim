# GitHub Pages publishes main / (root) using Jekyll.
# Raspberry Manager uses the same Supabase administrator login as the help center.
# Do not add .nojekyll or switch to an unfiltered repository upload.
exclude:
  - RaspberryManager/src
  - scripts
  - tests
  - node_modules
  - test-results
  - playwright-report
  - playwright.config.js
  - package.json
  - package-lock.json
  - README.md
  - docs/arsiv
  - docs/raspberry-manager/arsiv
  - Destek/src
  - Destek/supabase
